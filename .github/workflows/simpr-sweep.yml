# Reusable workflow: weekly sweep of orphaned and old builds.
#
#   on:
#     schedule:
#       - cron: '17 4 * * 1'
#     workflow_dispatch:
#   jobs:
#     simpr:
#       uses: dromerobarria/SimPR/.github/workflows/simpr-sweep.yml@v1
name: SimPR sweep

on:
  workflow_call:
    inputs:
      max-age-days:
        type: number
        default: 30
        description: Delete builds older than this, even on open PRs (0 disables).
      dry-run:
        type: boolean
        default: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      pull-requests: write
    steps:
      - uses: dromerobarria/SimPR/action/sweep@v1
        with:
          max-age-days: ${{ inputs.max-age-days }}
          dry-run: ${{ inputs.dry-run }}
