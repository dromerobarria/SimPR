name: SampleApp
options:
  bundleIdPrefix: dev.simpr.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SampleApp:
    type: application
    platform: iOS
    sources: [SampleApp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.simpr.example.SampleApp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SimPR Sample
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
schemes:
  SampleApp:
    build:
      targets:
        SampleApp: all
