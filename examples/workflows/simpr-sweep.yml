# Copy to .github/workflows/simpr-sweep.yml.
# Weekly: deletes builds of closed PRs, builds whose run is gone, and builds older than max-age-days.
name: SimPR sweep

on:
  schedule:
    - cron: '17 4 * * 1'   # Mondays 04:17 UTC
  workflow_dispatch:

jobs:
  simpr:
    permissions:
      actions: write
      pull-requests: write
    uses: dromerobarria/SimPR/.github/workflows/simpr-sweep.yml@v1
    with:
      max-age-days: 30
