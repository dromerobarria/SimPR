name: SimPR
options:
  bundleIdPrefix: dev.danielromero
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  SimPRCore:
    path: SimPRCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set to your GitHub OAuth app's client ID (Device Flow enabled). Empty disables "Sign in with GitHub".
    SIMPR_GITHUB_CLIENT_ID: ""
targets:
  SimPR:
    type: application
    platform: macOS
    sources:
      - path: SimPR
        excludes: ["Info.plist"]
    dependencies:
      - package: SimPRCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.danielromero.SimPR
        PRODUCT_NAME: SimPR
        INFOPLIST_FILE: SimPR/Info.plist
        CODE_SIGN_ENTITLEMENTS: SimPR/SimPR.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
schemes:
  SimPR:
    build:
      targets:
        SimPR: all
    run:
      config: Debug
    archive:
      config: Release
